apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  # Public repository: only the two logos the profile shows, never the manifest (it lists the whole
  # private release) and never the handbook (handbook CODE-8). Renovate raises the tag.
  - path: external/brand
    contents:
      - path: .
        git:
          url: https://github.com/kesseltech/brand.git
          ref: v0.5.0
        includePaths:
          - dist/logo/png/kessel-logo-horizontal-navy.png
          - dist/logo/png/kessel-logo-horizontal-white.png
        legalPaths: []
        newRootPath: dist
